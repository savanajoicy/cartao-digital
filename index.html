<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060D24">
<title>Savana Rabelo – iRede</title>
<meta name="description" content="Entre em contato com Savana Rabelo, Coordenadora de Projetos da iRede.">
<style>
  :root {
    --bg-deep: #060D24;
    --accent:  #1C5FFF;
    --accent2: #00B4FF;
    --white:   #FFFFFF;
    --soft:    rgba(255,255,255,0.6);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
    background: var(--bg-deep);
    color: var(--white);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(32px, env(safe-area-inset-top)) 24px
             max(32px, env(safe-area-inset-bottom));
    overflow: hidden;
    position: relative;
  }

  /* ── canvas hexagonal ── */
  .hex-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* ── partículas ── */
  .particles {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: var(--accent2);
    opacity: 0;
    animation: float linear infinite;
  }
  @keyframes float {
    0%   { opacity: 0;   transform: translateY(0) scale(1); }
    10%  { opacity: 0.6; }
    80%  { opacity: 0.3; }
    100% { opacity: 0;   transform: translateY(-80vh) scale(0.4); }
  }

  /* ── card ── */
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* logo — sem fundo, sem fallback visível */
  .logo-wrap {
    margin-bottom: 28px;
    height: 36px;
    display: flex;
    align-items: center;
  }
  .logo-wrap img {
    height: 36px;
    width: auto;
    filter: brightness(0) invert(1);
    display: block;
  }

  /* foto de perfil */
  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    overflow: hidden;
    margin-bottom: 16px;
    border: 2.5px solid rgba(28,95,255,0.5);
    box-shadow: 0 0 0 4px rgba(0,180,255,0.12), 0 0 28px rgba(0,180,255,0.2);
    flex-shrink: 0;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .name {
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: -0.025em;
    text-align: center;
    margin-bottom: 5px;
  }
  .role {
    font-size: 0.9rem;
    color: var(--soft);
    text-align: center;
    margin-bottom: 28px;
    letter-spacing: 0.01em;
  }

  .divider {
    width: 36px;
    height: 1.5px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    margin-bottom: 28px;
  }

  /* ── botões discretos ── */
  .buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 20px;
    border-radius: 14px;
    text-decoration: none;
    color: var(--white);
    font-size: 0.95rem;
    font-weight: 600;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    transition: background .15s ease, border-color .15s ease, transform .12s ease;
    position: relative;
    overflow: hidden;
  }
  .btn:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.18);
  }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 2px solid var(--accent2); outline-offset: 3px; }

  /* linha colorida sutil na borda esquerda */
  .btn::before {
    content: '';
    position: absolute;
    left: 0; top: 10%; bottom: 10%;
    width: 3px;
    border-radius: 3px;
  }
  .btn.wa::before { background: #25D366; }
  .btn.li::before { background: #0A66C2; }

  .btn-icon {
    flex: none;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: grid;
    place-items: center;
  }
  .btn.wa .btn-icon { background: rgba(37,211,102,0.15); }
  .btn.li .btn-icon { background: rgba(10,102,194,0.2); }
  .btn-icon svg { width: 22px; height: 22px; fill: var(--white); }

  .btn-text strong { display: block; font-size: 0.95rem; }
  .btn-text span { font-size: 0.8rem; opacity: 0.65; font-weight: 400; }

  .btn-arrow { margin-left: auto; opacity: 0.3; font-size: 1rem; }

  @media (prefers-reduced-motion: reduce) {
    .particle { animation: none; }
    .btn { transition: none; }
  }
</style>
</head>

<script>
// ── Partículas flutuantes ───────────────────────────────────────
(function(){
  const c = document.getElementById('particles');
  for (let i = 0; i < 24; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const s = Math.random() * 2.5 + 1;
    p.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;bottom:${Math.random()*15-5}%;animation-duration:${7+Math.random()*10}s;animation-delay:${Math.random()*9}s;`;
    c.appendChild(p);
  }
})();

// ── Canvas hexagonal ────────────────────────────────────────────
(function(){
  const cv = document.getElementById('hexCanvas');
  const cx = cv.getContext('2d');
  let W, H, hexes;
  function hex(x,y,r){
    cx.beginPath();
    for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);i===0?cx.moveTo(x+r*Math.cos(a),y+r*Math.sin(a)):cx.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));}
    cx.closePath();
  }
  function build(){
    W=cv.width=window.innerWidth; H=cv.height=window.innerHeight;
    hexes=[];
    const r=42,dx=r*1.73,dy=r*1.5;
    const cols=Math.ceil(W/dx)+2, rows=Math.ceil(H/dy)+2;
    for(let row=-1;row<rows;row++) for(let col=-1;col<cols;col++)
      hexes.push({x:col*dx+(row%2)*dx*.5,y:row*dy,phase:Math.random()*Math.PI*2,speed:4e-4+Math.random()*6e-4});
  }
  function draw(ts){
    cx.clearRect(0,0,W,H);
    hexes.forEach(h=>{
      const a=(Math.sin(ts*h.speed+h.phase)*.5+.5)*.16+.03;
      cx.strokeStyle=`rgba(28,95,255,${a.toFixed(3)})`;
      cx.lineWidth=1;
      hex(h.x,h.y,40);
      cx.stroke();
    });
    requestAnimationFrame(draw);
  }
  build();
  window.addEventListener('resize',build);
  requestAnimationFrame(draw);
})();
</script>
